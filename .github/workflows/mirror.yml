name: Publish mainland mirror
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish research library, Discover literature candidates]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: mainland-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: vars.COS_MIRROR_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: mainland-mirror
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_pages.py
      - run: python scripts/validate.py
      - run: python -m pip install cos-python-sdk-v5
      - name: Upload built website
        env:
          COS_REGION: ${{ vars.COS_REGION }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
        run: python scripts/publish_mirror.py
