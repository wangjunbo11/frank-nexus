name: Publish mainland mirror
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mainland-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: vars.COS_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: mainland-mirror
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_publication.py
      - run: python scripts/build_pages.py
      - run: python scripts/validate.py
      - run: python -m pip install cos-python-sdk-v5
      - name: Upload built website
        env:
          COS_REGION: ${{ vars.COS_REGION }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
        run: python scripts/publish_mirror.py
