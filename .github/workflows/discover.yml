name: Discover literature candidates
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: literature-discovery
  cancel-in-progress: false
jobs:
  discover:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_publication.py
      - name: Query Crossref
        run: python scripts/discover.py
      - name: Save candidates
        run: |
          git config user.name 'Frank Nexus updater'
          git config user.email 'nexus-updater@users.noreply.github.com'
          git add dist/candidates.json dist/discovery-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update literature discovery candidates'
            git push
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: literature-candidates
          path: dist/candidates.json
  publish:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - run: python3 scripts/check_publication.py
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build_pages.py
      - run: python3 scripts/validate.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package public Pages files
        run: tar -C dist -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
